<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com https://gist.githubusercontent.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EEF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1B1D" media="(prefers-color-scheme: dark)">
<title>Moving to NTU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M14 4h36a6 6 0 0 1 6 6v44a6 6 0 0 1-6 6H14a6 6 0 0 1-6-6V18z' fill='%23F0A23B'/%3E%3Ccircle cx='22' cy='18' r='5' fill='%230E5A5F'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --surface-2:#F5F8F7; --ink:#14292C; --muted:#56696B; --line:#D3DEDB;
  --teal:#0E5A5F; --teal-ink:#FFFFFF; --teal-soft:#DCEDEB;
  --marigold:#F0A23B; --marigold-ink:#2E1C00; --tag-line:rgba(46,28,0,.22);
  --red:#B42234; --red-soft:#FBE3E5; --amber:#8A5300; --amber-soft:#FFF0D2; --green:#1E6E46; --green-soft:#DDF1E5;
  --shadow:0 1px 2px rgba(20,41,44,.06), 0 6px 18px rgba(20,41,44,.06);
  --rounded: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", system-ui, sans-serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1B1D; --surface:#152729; --surface-2:#1A2F31; --ink:#E4EEED; --muted:#9BB1B1; --line:#284241;
    --teal:#62C4BE; --teal-ink:#052628; --teal-soft:#1D3B3C;
    --marigold:#F2AE52; --marigold-ink:#2A1900; --tag-line:rgba(42,25,0,.25);
    --red:#FF8892; --red-soft:#3A1F24; --amber:#F3C063; --amber-soft:#3A2F17; --green:#78D6A0; --green-soft:#183326;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1B1D; --surface:#152729; --surface-2:#1A2F31; --ink:#E4EEED; --muted:#9BB1B1; --line:#284241;
  --teal:#62C4BE; --teal-ink:#052628; --teal-soft:#1D3B3C;
  --marigold:#F2AE52; --marigold-ink:#2A1900; --tag-line:rgba(42,25,0,.25);
  --red:#FF8892; --red-soft:#3A1F24; --amber:#F3C063; --amber-soft:#3A2F17; --green:#78D6A0; --green-soft:#183326;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--sans);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Header */
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.brand{font:700 19px/1.2 var(--rounded);margin-right:auto;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;white-space:nowrap;flex:none}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.pill[data-s="saved"] .dot{background:var(--green)}
.pill[data-s="syncing"] .dot{background:var(--teal);animation:pulse 1s ease-in-out infinite}
.pill[data-s="offline"] .dot{background:var(--amber)}
.pill[data-s="error"]{border-color:var(--red);color:var(--red)} .pill[data-s="error"] .dot{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent}
.icon-btn:hover{background:var(--surface)}
.icon-btn svg{width:24px;height:24px}

/* Luggage tag countdown */
.tag{position:relative;margin:6px 0 14px;padding:22px 22px 16px 58px;background:var(--marigold);color:var(--marigold-ink);
  border-radius:0 18px 18px 0;clip-path:polygon(30px 0,100% 0,100% 100%,30px 100%,0 calc(100% - 30px),0 30px)}
.tag::before{content:"";position:absolute;left:20px;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 4px var(--tag-line)}
.tag::after{content:"";position:absolute;left:46px;top:14px;bottom:14px;border-left:2px dashed var(--tag-line)}
.tag-label{margin:0;font-weight:600;font-size:16px}
.tag-big{margin:0;font:800 clamp(64px,21vw,112px)/.95 var(--rounded);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tag-big small{font-size:.36em;letter-spacing:0;font-weight:700;margin-left:.12em}
.tag-sub{margin:4px 0 0;font:700 22px/1.2 var(--rounded)}
.tag-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--tag-line);font-size:15px}
.tag-foot b{font-weight:700}
.tag-btn{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--marigold-ink);background:transparent;color:var(--marigold-ink);font-weight:700;font-size:15px}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
.banner p{margin:0;flex:1}
.banner.err{border-color:var(--red);background:var(--red-soft)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:17px}
.btn.primary{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.btn.danger{color:var(--red);border-color:var(--red);background:transparent}
.btn.small{min-height:44px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.block{width:100%}

/* Section heads, progress, chips */
.view{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
.vhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:6px 0 10px}
.vhead h2{margin:0;font:750 24px/1.2 var(--rounded);letter-spacing:-.01em}
.vhead .count{color:var(--muted);font-size:15px}
.progress{margin:0 0 12px}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:600;white-space:nowrap}
.chip .n{font-size:13px;color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip.ghost{border-style:dashed;background:transparent}

/* Rows */
.group-h{margin:16px 2px 6px;font-size:14px;font-weight:700;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:stretch;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);border:1px solid transparent;overflow:hidden}
.row.overdue{border-color:var(--red);box-shadow:inset 5px 0 0 var(--red)}
.row.today{border-color:var(--amber);box-shadow:inset 5px 0 0 var(--amber)}
.row.done .row-title{text-decoration:line-through;color:var(--muted)}
.tick{flex:none;display:grid;place-items:center;width:60px;cursor:pointer}
.tick input{appearance:none;-webkit-appearance:none;margin:0;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--muted);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.tick input:checked{background:var(--green);border-color:var(--green)}
.tick input:checked::after{content:"";width:8px;height:15px;border:solid var(--surface);border-width:0 3.5px 3.5px 0;transform:translateY(-2px) rotate(45deg)}
.row-main{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:13px 14px 13px 0;display:flex;flex-direction:column;gap:3px}
.row-main.pad{padding-left:16px}
.row-title{font-weight:650;font-size:17px;overflow-wrap:anywhere}
.qty{font-weight:600;color:var(--muted);margin-left:4px}
.row-notes{font-size:15px;color:var(--ink);opacity:.85;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.row-meta{font-size:13px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.teal{background:var(--teal-soft);color:var(--teal)}
.answer{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.answer.none{color:var(--muted);font-style:italic}
.links{display:flex;flex-direction:column;gap:2px;padding:0 14px 12px 16px;margin-top:-6px}
.links a{color:var(--teal);font-size:15px;font-weight:600;overflow-wrap:anywhere;padding:6px 0}
.qcard{flex-direction:column}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px;border:1px dashed var(--line)}
details.done-box{margin-top:16px}
details.done-box>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;cursor:pointer}
details.done-box>summary::-webkit-details-marker{display:none}
details.done-box>summary::before{content:"";width:9px;height:9px;border:solid var(--muted);border-width:0 2.5px 2.5px 0;transform:rotate(-45deg);transition:transform .2s}
details.done-box[open]>summary::before{transform:rotate(45deg)}
details.done-box>.list{margin-top:8px}

/* Bottom tabs + add button */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:66px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:650;position:relative}
.tab svg{width:26px;height:26px}
.tab small{font-size:12px;font-weight:600}
.tab[aria-selected="true"]{color:var(--teal)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--teal)}
.fab{position:fixed;z-index:6;right:max(16px,calc(50% - 304px));bottom:calc(82px + env(safe-area-inset-bottom));display:inline-flex;align-items:center;gap:8px;min-height:58px;padding:0 24px 0 20px;border-radius:999px;border:0;background:var(--teal);color:var(--teal-ink);font-weight:750;font-size:17px;box-shadow:0 6px 20px rgba(14,90,95,.35)}
.fab svg{width:22px;height:22px}

/* Sheet (dialog) */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(5,20,22,.5)}
@media (min-width:640px){dialog.sheet{margin:auto;border-radius:22px}}
.sheet-form{display:flex;flex-direction:column;max-height:92vh}
.sheet-head{display:flex;align-items:center;gap:8px;padding:16px 16px 6px 20px}
.sheet-head h2{flex:1;margin:0;font:750 21px/1.25 var(--rounded)}
.sheet-body{padding:6px 20px 8px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-actions .btn{flex:1 1 auto}
.sheet-actions .btn.primary{flex:2 1 auto}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-weight:650;font-size:15px}
.hint{font-size:14px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-size:17px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.check-field{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:650}
.check-field input{width:26px;height:26px;accent-color:var(--green)}
.seg{display:flex;gap:6px;padding:4px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{flex:1 1 auto;white-space:nowrap;padding:0 10px;min-height:46px;border:0;border-radius:10px;background:transparent;font-weight:650;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.err-text{color:var(--red);font-weight:600;font-size:15px;margin:0}
.ok-text{color:var(--green);font-weight:600;font-size:15px;margin:0}
.box{padding:14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.box h3{margin:0;font-size:17px}
.box p{margin:0;font-size:15px}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.cat-row{display:flex;gap:8px;align-items:center}
.cat-row .input{flex:1}
.del-row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.del-row:last-child{border-bottom:0}
.muted{color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:10px 10px 10px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{min-height:40px;padding:0 14px;border-radius:10px;border:0;background:var(--marigold);color:var(--marigold-ink);font-weight:750}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Moving to NTU</div>
    <button class="pill" id="syncPill" type="button" aria-live="polite"><span class="dot"></span><span id="syncText">Not shared</span></button>
    <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="tag" id="countdown" aria-live="off">
    <p class="tag-label" id="cdLabel">Leaving for Singapore in</p>
    <p class="tag-big" id="cdBig">–</p>
    <p class="tag-sub" id="cdSub" hidden></p>
    <div class="tag-foot">
      <span>Flight: <b id="cdDate">–</b><br><span id="cdTz">India time</span></span>
      <button class="tag-btn" id="editDate" type="button">Change date</button>
    </div>
  </section>

  <div id="banner"></div>

  <main id="main">
    <section class="view" id="view-buy" data-view="buy"></section>
    <section class="view" id="view-todos" data-view="todos" hidden></section>
    <section class="view" id="view-questions" data-view="questions" hidden></section>
  </main>
</div>

<button class="fab" id="addBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="addText">Add item</span></button>

<nav class="tabs" aria-label="Sections">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="buy" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="13" rx="2"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
      Things to buy<small id="tabBuyN"></small></button>
    <button class="tab" role="tab" data-tab="todos" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>
      To-do<small id="tabTodoN"></small></button>
    <button class="tab" role="tab" data-tab="questions" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg>
      Questions<small id="tabQN"></small></button>
  </div>
</nav>

<dialog class="sheet" id="sheet"></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';
(function(){
/* ---------- constants & storage ---------- */
const FILE = 'ntu-prep-data.json';
const API = 'https://api.github.com';
const GIST_DESC = 'Data for the "Moving to NTU" prep website. Please do not edit by hand.';
const COLLS = ['settings','people','categories','buy','todos','questions'];
const IST = 330 * 60000;
const POLL_MS = 30000;
const K = { state:'ntuprep.state', synced:'ntuprep.syncedHash', token:'ntuprep.token', gist:'ntuprep.gistId', login:'ntuprep.login',
            name:'ntuprep.name', device:'ntuprep.deviceId', theme:'ntuprep.theme', ui:'ntuprep.ui', lastOk:'ntuprep.lastOk', scopes:'ntuprep.extraScopes' };
const ls = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)));
if (!ls.get(K.device)) ls.set(K.device, uid());
const deviceId = ls.get(K.device);
const me = () => (ls.get(K.name) || '').trim() || 'Someone';
const token = () => ls.get(K.token) || '';

/* ---------- data model & merge ---------- */
function emptyDB(){ const c = {}; COLLS.forEach(k => c[k] = {}); return { app:'ntu-prep', schema:1, collections:c }; }
function canonStr(v){
  if (Array.isArray(v)) return '[' + v.map(canonStr).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canonStr(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}

  const s = (Date.now() - ts) / 1000;

  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400){ const h = Math.floor(s / 3600); return h + (h === 1 ? ' hour ago' : ' hours ago'); }
  const d = Math.floor(s / 86400);

async function connect(t, fromForm){
  let res;
  try { res = await fetch(API + '/user', { cache:'no-store', headers:{ Accept:'application/vnd.github+json', Authorization:'Bearer ' + t } }); }
  catch(e){ const m = 'Could not reach GitHub. Check the internet connection and try again.'; if (!fromForm) toast(m); return m; }
  if (res.status === 401){ const m = 'That access code did not work. Check it was copied fully, or ask Rohith for a new one.'; if (!fromForm){ toast(m); openConnect(); } return m; }
  if (!res.ok){ const m = 'GitHub said no (error ' + res.status + '). Try again in a minute.'; if (!fromForm) toast(m); return m; }
  const scopes = res.headers.get('x-oauth-scopes');
  if (scopes != null){
    const list = scopes.split(',').map(s => s.trim()).filter(Boolean);
    if (!list.includes('gist')){ const m = 'This access code is missing the “gist” permission. Create a new one with only “gist” ticked.'; if (!fromForm){ toast(m); openConnect(); } return m; }
    ls.set(K.scopes, list.filter(s => s !== 'gist').join(', '));
  } else ls.del(K.scopes);
  let login = ''; try { login = (await res.json()).login || ''; } catch(e){}
  if (t !== token()) ls.del(K.gist);
  ls.set(K.token, t); ls.set(K.login, login); ls.del(K.synced);
  closeSheet(); toast('Connected. Getting the shared list…');
  setStatus('syncing'); syncNow();
  return true;
}
function disconnect(){
  if (!confirm('Disconnect this device? Your list stays on this device, but changes will no longer be shared until you connect again.')) return;
  [K.token, K.gist, K.login, K.synced, K.scopes].forEach(k => ls.del(k));
  setStatus('local'); render(); openSettings();
}

      <div class="box"><h3>Restore backup</h3><p>Everything in the backup goes back to how it was then, including deleted things. Anything added after the backup is kept.</p></div>`,
    actions: [
      { label:'Add from backup', kind:'primary', run: () => { db = mergeDB(db, data); changed(); toast('Backup added'); } },
      { label:'Restore backup', run: () => {
        const now = Date.now(), win = emptyDB();
        for (const [k, c] of Object.entries(data.collections)){ if (!c || typeof c !== 'object') continue; win.collections[k] = {};
          for (const [id, r] of Object.entries(c)) if (isRec(r)){ const cur = db.collections[k] && db.collections[k][id]; win.collections[k][id] = Object.assign({}, r, { updatedAt: Math.max(now, ((cur && +cur.updatedAt) || 0) + 1), by: me() }); } }
        db = mergeDB(db, win); changed(); toast('Backup restored'); } },
      { label:'Cancel' }] });

/* ---------- sync ---------- */
const sync = { busy:false, again:false, status:'local', msg:'', retry:null, debounce:null, lastEnd:0 };
function setStatus(s, msg){
  sync.status = s; sync.msg = msg || '';
  const pill = $('#syncPill'); pill.dataset.s = s;
  $('#syncText').textContent = { local:'Not shared', syncing:'Syncing…', saved:'Saved', offline:'Offline – will retry', error:'Needs attention' }[s];
  pill.title = msg || '';
  renderBanner();
}
const pending = () => hash(canon(db)) !== ls.get(K.synced);
function changed(){
  persist(); render();
  clearTimeout(sync.debounce);
  if (token()){ if (sync.status !== 'error') setStatus(navigator.onLine === false ? 'offline' : 'syncing'); sync.debounce = setTimeout(syncNow, 600); }
}
async function api(path, method, body){
  const res = await fetch(API + path, { method: method || 'GET', cache:'no-store',
    headers: Object.assign({ Accept:'application/vnd.github+json', Authorization:'Bearer ' + token() }, body ? { 'Content-Type':'application/json' } : {}),
    body: body ? JSON.stringify(body) : undefined });
  if (!res.ok){ const e = new Error('GitHub error ' + res.status); e.status = res.status; e.rate = res.headers.get('x-ratelimit-remaining') === '0' || res.status === 429; throw e; }
  return res.status === 204 ? null : res.json();
}
async function listOurGists(){
  const found = [];
  for (let page = 1; page <= 10; page++){
    const arr = await api('/gists?per_page=100&page=' + page);
    if (!Array.isArray(arr)) break;
    arr.forEach(g => { if (g && g.files && g.files[FILE]) found.push(g); });
    if (arr.length < 100) break;
  }
  return found.sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)) || String(a.id).localeCompare(String(b.id)));
}
async function findOrCreateGist(){
  let list = await listOurGists();
  if (list.length) return list[0].id;
  const created = await api('/gists', 'POST', { description: GIST_DESC, public:false, files:{ [FILE]:{ content: serialize(db) } } });
  list = await listOurGists();   // if two devices created one at the same moment, everyone picks the oldest
  return list.length ? list[0].id : created.id;
}
function serialize(d){ return JSON.stringify({ app:'ntu-prep', schema:1, savedAt:new Date().toISOString(), savedBy:me(), collections:d.collections }, null, 1); }
async function readGist(id){
  const g = await api('/gists/' + id);
  const f = g && g.files && g.files[FILE];
  if (!f) return { data:null };
  let text = f.content;
  if (f.truncated && f.raw_url){ const r = await fetch(f.raw_url, { cache:'no-store' }); if (!r.ok){ const e = new Error('raw ' + r.status); e.status = r.status; throw e; } text = await r.text(); }
  try { const d = JSON.parse(text); if (!d || typeof d !== 'object' || !d.collections || typeof d.collections !== 'object') throw 0; return { data:d }; }
  catch(e){ return { data:null, damaged: text || '(empty)' }; }
}
async function writeGist(id, data, damaged){
  const files = { [FILE]:{ content: serialize(data) } };
  if (damaged != null) files['damaged-copy-' + Date.now() + '.txt'] = { content: damaged };
  await api('/gists/' + id, 'PATCH', { files });
}
async function syncNow(){
  if (!token()){ setStatus('local'); return; }
  if (sync.busy){ sync.again = true; return; }
  sync.busy = true; clearTimeout(sync.retry); clearTimeout(sync.debounce);
  setStatus('syncing');
  let rediscovered = false, rounds = 0;
  try {
    do {
      sync.again = false;
      let gid = ls.get(K.gist);
      if (!gid){ gid = await findOrCreateGist(); ls.set(K.gist, gid); }
      let r;
      try { r = await readGist(gid); }
      catch(e){ if (e.status === 404 && !rediscovered){ rediscovered = true; ls.del(K.gist); sync.again = true; continue; } throw e; }
      const remoteCanon = r.data ? canon(r.data) : null;
      db = mergeDB(db, r.data);           // db already holds any edits made while we waited
      persist(); render();
      const snapshot = JSON.parse(JSON.stringify(db)), target = canon(snapshot);
      if (target !== remoteCanon || r.damaged != null) await writeGist(gid, snapshot, r.damaged);
      ls.set(K.synced, hash(target));
      if (pending()) sync.again = true;    // someone edited during the upload
    } while (sync.again && ++rounds < 6);
    ls.set(K.lastOk, String(Date.now()));
    setStatus(pending() ? 'syncing' : 'saved');
    if (pending()) sync.retry = setTimeout(syncNow, 2000);
  } catch(e){
    if (e.status === 401){ setStatus('error', 'The access code stopped working (it may have expired). Tap “Fix” to enter a new one.'); }
    else if (e.status === 403 && !e.rate){ setStatus('error', 'This access code is not allowed to save the list. Make a new one with the “gist” permission.'); }
    else if (e.rate){ setStatus('offline', 'GitHub is busy. Will retry in a minute.'); sync.retry = setTimeout(syncNow, 60000); }
    else { setStatus('offline', navigator.onLine === false ? 'No internet. Your changes are saved on this device.' : 'Could not reach GitHub. Will retry.'); sync.retry = setTimeout(syncNow, 15000); }
  } finally { sync.busy = false; sync.lastEnd = Date.now(); render(); }
}
function maybeSync(){ if (token() && document.visibilityState === 'visible' && (pending() || Date.now() - sync.lastEnd > 4000)) syncNow(); }
setInterval(() => { if (document.visibilityState === 'visible') syncNow(); }, POLL_MS);
setInterval(() => { renderCountdown(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ render(); maybeSync(); } });
window.addEventListener('focus', maybeSync);
window.addEventListener('online', () => syncNow());
window.addEventListener('offline', () => { if (token()) setStatus('offline', 'No internet. Your changes are saved on this device.'); });
window.addEventListener('storage', e => { if (e.key === K.state && e.newValue){ try { db = mergeDB(db, JSON.parse(e.newValue)); render(); } catch(err){} } });

document.addEventListener('change', e => {
  const c = e.target.closest('[data-toggle]');
  if (c){ const v = c.checked; upsert(c.dataset.toggle, c.dataset.id, { [c.dataset.field]: v });
    if (v) toast(c.dataset.field === 'bought' ? 'Marked as bought' : 'Marked as done'); }
});
document.addEventListener('toggle', e => { const d = e.target; if (d.dataset && d.dataset.openKey){ ui.open[d.dataset.openKey] = d.open; saveUI(); } }, true);
$('#addBtn').onclick = () => ({ buy:editBuy, todos:editTodo, questions:editQuestion })[ui.tab]();
$('#editDate').onclick = editDeparture;
$('#settingsBtn').onclick = openSettings;
$('#syncPill').onclick = () => { if (!token() || sync.status === 'error') openConnect(); else syncNow(); };

/* ---------- start ---------- */
const m = location.hash.match(/[#&]connect=([^&]+)/);
if (m){ try { pendingConnect = decodeURIComponent(m[1]).trim(); } catch(e){} history.replaceState(null, '', location.pathname + location.search); }
setStatus(token() ? (pending() ? 'syncing' : 'saved') : 'local');
render();
if (!ls.get(K.name)) askName(true);
else {
  if (!live('people').some(p => p.id === deviceId)) upsert('people', deviceId, { name: ls.get(K.name) });
  if (pendingConnect){ const t = pendingConnect; pendingConnect = null; connect(t); }
  else syncNow();
}
window.NTU = { mergeDB, syncNow, get db(){ return db; }, get status(){ return sync.status; } };
})();
</script>
</body>
